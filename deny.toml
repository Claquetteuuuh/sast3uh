# ──────────────────────────────────────────────────────────────────────
# cargo-deny — the dependency gate (advisories, licenses, bans, sources).
# Runs locally from pre-commit (on a Cargo.toml / Cargo.lock / deny.toml
# change) and in CI on every push plus weekly, when the advisory DB moves.
# ──────────────────────────────────────────────────────────────────────
[graph]
all-features = true

[output]
feature-depth = 1

# ── Advisories (RustSec) ──────────────────────────────────────────────
# Every advisory is an error: vulnerability, unsound, unmaintained, notice.
# An entry in `ignore` needs the advisory id, a reason and a removal plan.
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = []

# ── Licenses ──────────────────────────────────────────────────────────
# Allow-list only. A crate with an unlisted license fails the check until
# the license is reviewed and added here on purpose.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = []
# The list above is a policy, not an inventory: an entry nothing uses yet is fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

# ── Bans ──────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  # Native TLS pulls a C library into a tool meant to be a single static
  # binary; rustls is the only TLS stack this crate may link.
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
]
skip = []
skip-tree = []

# ── Sources ───────────────────────────────────────────────────────────
# crates.io only. No git dependencies: a branch or a rewritten tag is a
# supply-chain door, and cargo-deny cannot audit what it cannot resolve.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
