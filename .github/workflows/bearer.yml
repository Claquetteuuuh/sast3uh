# ──────────────────────────────────────────────────────────────────────
# Bearer SAST — Static Application Security Testing + sensitive data
# Scans source code for security issues. Fails on Critical/High.
# Results uploaded to GitHub Security → Code scanning tab.
#
# Bearer has no Rust rules (it covers JS/TS, Python, Go, Java, Ruby, PHP):
# on a Rust-only tree it reports "0 rules found" and exits 0. It earns its
# place the day a helper script in one of those languages lands.
#
# The binary is a pinned release verified against the release's
# checksums.txt — not bearer/bearer-action, whose install step pipes
# raw.githubusercontent.com/…/main/…/install.sh into a shell at run time.
# ──────────────────────────────────────────────────────────────────────
name: "🛡️ Bearer SAST"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 6:30 AM UTC — catch new rules.
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BEARER_VERSION: "2.1.3"

jobs:
  sast:
    name: Bearer scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bearer (pinned release, checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          gh release download "v${BEARER_VERSION}" --repo Bearer/bearer --dir "$tmp" \
            --pattern "bearer_${BEARER_VERSION}_linux_amd64.tar.gz" --pattern checksums.txt
          (cd "$tmp" && grep " bearer_${BEARER_VERSION}_linux_amd64.tar.gz\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/bearer_${BEARER_VERSION}_linux_amd64.tar.gz" -C "$tmp" bearer
          install -m 0755 "$tmp/bearer" /usr/local/bin/bearer
          bearer version

      # With a report format, Bearer exits 1 when the tree has no file in a language
      # it supports — and writes a text notice into the output file instead of
      # SARIF. That is "nothing to scan", not a finding.
      - name: Run Bearer SAST scan
        run: |
          set -uo pipefail
          # The runner's shell is `bash -e`: capture the exit code on the command itself,
          # or a non-zero Bearer ends the step before anything below runs.
          code=0
          bearer scan . --severity critical,high --format sarif --output bearer-results.sarif 2> bearer.stderr || code=$?
          echo "bearer exit code: $code"
          cat bearer.stderr
          if [ "$code" -ne 0 ] && [ -f bearer-results.sarif ] && ! head -c 1 bearer-results.sarif | grep -q '{'; then
            # Not SARIF: Bearer wrote its text report instead. Show it, and read it.
            echo "--- bearer-results.sarif (not JSON) ---"
            head -c 600 bearer-results.sarif
            echo
            echo "---------------------------------------"
            # 2.1.3 on a tree without a supported language: "The security report is not
            # yet available for your application. Learn more about language support…";
            # older versions: "0 rules found for supported language".
            if grep -qiE 'not yet available|language support|rules found|requires rules' bearer-results.sarif bearer.stderr; then
              echo "::notice::Bearer has no rules for the languages in this tree; nothing to scan"
              rm -f bearer-results.sarif
              exit 0
            fi
          fi
          exit "$code"

      - name: Keep only a real SARIF file
        if: always()
        run: |
          set -uo pipefail
          if [ -f bearer-results.sarif ] && ! head -c 1 bearer-results.sarif | grep -q '{'; then
            echo "bearer-results.sarif is not JSON; dropping it"
            rm -f bearer-results.sarif
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('bearer-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bearer-results.sarif
          category: bearer-sast
