# ──────────────────────────────────────────────────────────────────────
# Release — on a vX.Y.Z tag: test, build the binary for each platform,
# attest its build provenance (SLSA, Sigstore), publish a GitHub release
# with the tarballs, their SHA-256 and generated notes.
#
# No cache is restored here (a poisoned cache must not reach a release),
# the publish job runs in the `release` environment, and the tag must
# match Cargo.toml's version.
# ──────────────────────────────────────────────────────────────────────
name: "🚀 Release"

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: "Build ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # Sigstore signing of the provenance
      attestations: write # store the attestation on the repo
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup show

      - name: The tag must be the crate's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          grep -q "^version = \"${version}\"$" Cargo.toml || { echo "Cargo.toml is not at ${version}"; exit 1; }

      # The whole suite, on the exact commit that ships.
      - name: Test
        run: cargo test --all-features --locked

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      # Two shapes of the same build: the bare executable, to download and run as
      # is, and an archive with README and SECURITY.md. Both get a SHA-256 file and
      # a provenance attestation.
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="sasteuuuh-${TAG#v}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/sasteuuuh" README.md SECURITY.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -r "dist/${name}"
          install -m 0755 "target/${TARGET}/release/sasteuuuh" "dist/${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" && shasum -a 256 "${name}" > "${name}.sha256")
          cat dist/*.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/sasteuuuh-*-${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build]
    environment: release
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          : > checksums.txt
          for f in sasteuuuh-*; do
            case "$f" in *.sha256) continue ;; esac
            shasum -a 256 "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes dist/*
