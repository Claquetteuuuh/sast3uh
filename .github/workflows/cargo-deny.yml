# ──────────────────────────────────────────────────────────────────────
# cargo-deny — the dependency gate (deny.toml)
# RustSec advisories, license allow-list, banned crates, crates.io-only
# sources. Weekly too: the advisory database moves without a commit.
# ──────────────────────────────────────────────────────────────────────
name: "🦀 cargo-deny"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 5:30 AM UTC — new advisories against existing deps.
    - cron: "30 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: "cargo deny check ${{ matrix.checks }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
          arguments: --all-features --locked
