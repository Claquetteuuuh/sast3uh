# ──────────────────────────────────────────────────────────────────────
# CI Hardening — zizmor, the GitHub Actions security linter (template
# injection, unpinned actions, credential persistence, excessive
# permissions…). Plumber, the CI/CD trust policy, has its own workflow
# (plumber.yml).
# ──────────────────────────────────────────────────────────────────────
name: "🔧 CI Hardening"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Tuesday 4 AM UTC — new audits, new advisories on actions.
    - cron: "0 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
      actions: read # lets zizmor read workflow metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: regular
          min-severity: low
