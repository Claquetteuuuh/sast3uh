[package]
name = "sast3uh"
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
description = "One SAST to run them all: a hardened wrapper that runs many static analysers and merges their findings"
repository = "https://github.com/Claquetteuuuh/sast3uh"
readme = "README.md"
keywords = ["sast", "security", "static-analysis", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Not on crates.io (yet): a stray `cargo publish` must fail, not ship.
publish = false

[[bin]]
name = "sast3uh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

# ── Lints ─────────────────────────────────────────────────────────────
# CI compiles with `-D warnings`, so every `warn` below is a hard failure
# there. The `deny` entries are the ones that must also fail a plain
# `cargo build` on a developer machine.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pedantic noise that buys nothing here.
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
# A scanner wrapper runs other people's binaries on other people's code:
# it never panics on their output, never slices blindly, never exits
# from the middle of the library.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# ── Profiles ──────────────────────────────────────────────────────────
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# Integer overflow is a bug, in release too: a wrapped count or offset is
# how a parser of untrusted scanner output turns into a vulnerability.
overflow-checks = true

[profile.dev]
overflow-checks = true
